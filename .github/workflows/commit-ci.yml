name: Commit CI

on:
  push:
    branches:
      - '**'
    tags:
      - '![0-9]+.*'
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout last commit
        uses: actions/checkout@v4
      - name: Install clang-format 18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
      - name: Code style lint
        # Only lint the AI module: upstream 1.13.1 sources do not fully
        # conform to clang-format-18, and reformatting them would pollute
        # this fork's diff against upstream.
        run: |
          clang-format -Werror --dry-run \
            src/rime/ai/*.hpp src/rime/ai/*.cc \
            src/rime/gear/ai_ranker_filter.h src/rime/gear/ai_ranker_filter.cc \
            test/ai_test.cc

  linux:
    needs: lint
    uses: ./.github/workflows/linux-build.yml

  macos:
    needs: lint
    uses: ./.github/workflows/macos-build.yml

  windows:
    needs: lint
    uses: ./.github/workflows/windows-build.yml

  docker:
    needs: lint
    uses: ./.github/workflows/docker-build.yml
